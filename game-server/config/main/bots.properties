# =========================================================================
# Bot system configuration
# =========================================================================
# Master switch for AI bot players. When false, no bots are spawned.
gameserver.bots.enable = false

# How many bots to spawn automatically on server startup.
gameserver.bots.count = 10

# Map the bots should consider their "home" (informational; characters still
# spawn at their race's starting location from PLAYER_INITIAL_DATA).
gameserver.bots.spawnmap = 110010000

# Think loop interval in milliseconds (lower = more responsive, higher CPU).
gameserver.bots.thinkinterval = 1000

# Let bots use their learned skills in combat (shows casting animations to others).
gameserver.bots.useskills = true

# Chance (0..1) a bot casts a skill instead of a basic attack when in range.
gameserver.bots.skillchance = 0.5

# Maximum level bots will grind toward (soft limit, informational).
gameserver.bots.maxlevel = 55

# Base id for synthetic login accounts when no login DB is configured.
gameserver.bots.accountbase = 1000000000

# Optional: login-server JDBC URL. When set, a real login account row is
# created per bot (one account per bot). Leave empty to only create the
# character in the game-server database.
# Example: jdbc:mysql://localhost:3306/al_server_ls?useUnicode=true&characterEncoding=UTF-8
gameserver.bots.logindb.url =
gameserver.bots.logindb.user = root
gameserver.bots.logindb.password =
