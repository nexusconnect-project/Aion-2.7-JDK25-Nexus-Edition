# ----------------------------
# Geodata config's:
# ----------------------------

# Enable Geodata (heights and meshes)
# Default: false
gameserver.geodata.enable = true

# Enable canSee checks using geodata.
# Default: true
gameserver.geodata.cansee.enable = true

# Enable fear skill using geodata.
# Default: true
gameserver.geodata.fear.enable = true

# If enabled - during movements npcs will be checking z coordinate based on geo if target is flying
# Default: false
gameserver.geo.npc.move = true

#Enable npc checks aggro target visibility range (canSee)
# Default: false
gameserver.geo.npc.aggro = true

#Enable geo materials using skills
# Default: false
gameserver.geo.materials.enable = true

#Show collision zone name and skill id for GMs
# Default: false
gameserver.geo.materials.showdetails = true

#Enable geodata shields, for test purpose
# Default: false
gameserver.geo.shields.enable = false

#Enable geodata doors, for test purpose
# Default: false
gameserver.geo.doors.enable = false

# Enable object factory for geo primitives
# Default: true
gameserver.geodata.objectfactory.enabled = true

# ---------------------------------------------------------
# Pathfinding (JPS on pre-baked navigation grid + LRU cache)
# ---------------------------------------------------------

# Enable pathfinding for NPC movement (requires gameserver.geodata.enable = true)
# Default: true
gameserver.geo.pathfinding.enable = true

# Navigation grid resolution in world units per cell (smaller = finer, slower build)
# Default: 4
gameserver.geo.pathfinding.resolution = 4

# Maximum number of JPS node expansions per search (latency guard)
# Default: 2048
gameserver.geo.pathfinding.max.nodes = 2048

# Number of worker threads computing paths (async, daemon threads)
# Default: 2
gameserver.geo.pathfinding.threads = 2

# LRU path cache size (entries per world)
# Default: 1024
gameserver.geo.pathfinding.cache.size = 1024

# Maximum height difference in meters between two cells to be traversable on foot
# Default: 1.5
gameserver.geo.pathfinding.max.climb = 1.5

# Height above the local terrain at which obstacles are detected (chest height check).
# Any wall/rock/building intersecting this band blocks the cell and the move step,
# while lower objects (steps, curbs, stairs) stay walkable
# Default: 0.8
gameserver.geo.pathfinding.max.block = 0.8

# Terrain heights below this value are treated as void/blocked
# Default: -5
gameserver.geo.pathfinding.min.height = -5